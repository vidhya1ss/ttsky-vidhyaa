# Tiny Tapeout project information

project:
  title: "Stochastic MAC"
  author: "vidhya"
  discord: ""
  description: "4-bit Multiply-Accumulate unit with 16-bit accumulator"
  language: "Verilog"
  clock_hz: 50000000

  tiles: "1x1"

  top_module: "tt_um_smac"

  source_files:
    - "tt_um_smac.v"

pinout:

  # Inputs.
  ui[0]: "A[0]"
  ui[1]: "A[1]"
  ui[2]: "A[2]"
  ui[3]: "A[3]"
  ui[4]: "B[0]"
  ui[5]: "B[1]"
  ui[6]: "B[2]"
  ui[7]: "B[3]"

  # Outputs
  uo[0]: "ACC[0]"
  uo[1]: "ACC[1]"
  uo[2]: "ACC[2]"
  uo[3]: "ACC[3]"
  uo[4]: "ACC[4]"
  uo[5]: "ACC[5]"
  uo[6]: "ACC[6]"
  uo[7]: "ACC[7]"

  # Bidirectional pins
  uio[0]: "ACC[8]"
  uio[1]: "ACC[9]"
  uio[2]: "ACC[10]"
  uio[3]: "ACC[11]"
  uio[4]: "ACC[12]"
  uio[5]: "ACC[13]"
  uio[6]: "ACC[14]"
  uio[7]: "ACC[15]"

yaml_version: 6
